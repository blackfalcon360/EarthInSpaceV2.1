plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blackfalcon.earthinspace'
    compileSdk 34

    defaultConfig {
        applicationId "EarthInSpace.blackfalcon.jan"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
